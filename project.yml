name: BabeGetThis

options:
  bundleIdPrefix: com.babegetthis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Dev: debug
  Staging: debug
  Prod: release

configFiles:
  Dev: Config/Dev.xcconfig
  Staging: Config/Staging.xcconfig
  Prod: Config/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  BabeGetThis:
    type: application
    platform: iOS
    sources:
      - BabeGetThis
    dependencies:
      - package: GRDB
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: BabeGetThis/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTEnvironment: $(BGT_ENVIRONMENT)
        BGTSupabaseURL: $(BGT_SUPABASE_URL)
        BGTSupabaseAnonKey: $(BGT_SUPABASE_ANON_KEY)
        BGTApiBaseURL: $(BGT_API_BASE_URL)

  BabeGetThisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BabeGetThisTests
    dependencies:
      - target: BabeGetThis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BabeGetThis-Dev:
    build:
      targets:
        BabeGetThis: all
        BabeGetThisTests: [test]
    run:
      config: Dev
    test:
      config: Dev
      gatherCoverageData: true
      targets:
        - BabeGetThisTests
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev

  BabeGetThis-Staging:
    build:
      targets:
        BabeGetThis: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - BabeGetThisTests
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  BabeGetThis-Prod:
    build:
      targets:
        BabeGetThis: all
    run:
      config: Prod
    profile:
      config: Prod
    analyze:
      config: Prod
    archive:
      config: Prod
