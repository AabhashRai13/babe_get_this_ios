name: BabeGetThis

options:
  bundleIdPrefix: com.babegetthis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Dev: debug
  Staging: debug
  Prod: release

configFiles:
  Dev: Config/Dev.xcconfig
  Staging: Config/Staging.xcconfig
  Prod: Config/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    # 9.0+ for signIn(...nonce:), so the id token carries our hashed nonce (AUTH-05).
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"
  Firebase:
    # TEL-01/05: Analytics WITHOUT ad-id support (FirebaseAnalyticsCore, no AdSupport, no ATT)
    # and Crashlytics. Configured at runtime only when the BGT_FIREBASE_* settings are filled in.
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.0.0"

targets:
  BabeGetThis:
    type: application
    platform: iOS
    sources:
      - BabeGetThis
    dependencies:
      - package: GRDB
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
    entitlements:
      path: BabeGetThis/Resources/BabeGetThis.entitlements
      properties:
        # Sign in with Apple (AUTH-06). The capability must also be enabled on the App ID.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: BabeGetThis/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Babe, Get This uses the microphone to turn what you say into list items.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTEnvironment: $(BGT_ENVIRONMENT)
        BGTSupabaseURL: $(BGT_SUPABASE_URL)
        BGTSupabaseAnonKey: $(BGT_SUPABASE_ANON_KEY)
        BGTApiBaseURL: $(BGT_API_BASE_URL)
        # Google Sign-In (AUTH-05). Empty until the iOS OAuth client exists: see Secrets.example.xcconfig.
        GIDClientID: $(BGT_GOOGLE_IOS_CLIENT_ID)
        # Firebase (TEL-01): staging and prod use separate projects; dev sends nothing. Empty = off.
        BGTFirebaseGoogleAppID: $(BGT_FIREBASE_GOOGLE_APP_ID)
        BGTFirebaseGCMSenderID: $(BGT_FIREBASE_GCM_SENDER_ID)
        BGTFirebaseAPIKey: $(BGT_FIREBASE_API_KEY)
        BGTFirebaseProjectID: $(BGT_FIREBASE_PROJECT_ID)
        # App Store id for "Rate the app" (SET-02). Empty until the app has a listing.
        BGTAppStoreID: $(BGT_APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(BGT_GOOGLE_REVERSED_CLIENT_ID)

  BabeGetThisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BabeGetThisTests
    dependencies:
      - target: BabeGetThis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BabeGetThis-Dev:
    build:
      targets:
        BabeGetThis: all
        BabeGetThisTests: [test]
    run:
      config: Dev
    test:
      config: Dev
      gatherCoverageData: true
      targets:
        - BabeGetThisTests
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev

  BabeGetThis-Staging:
    build:
      targets:
        BabeGetThis: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - BabeGetThisTests
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  BabeGetThis-Prod:
    build:
      targets:
        BabeGetThis: all
    run:
      config: Prod
    profile:
      config: Prod
    analyze:
      config: Prod
    archive:
      config: Prod
